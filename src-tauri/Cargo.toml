[package]
name = "medicine-report-tracker"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Offline medical report vault"
publish = false

[lib]
# Tauri v2 keeps the app in a lib so the same crate can target desktop and, later,
# Android without duplicating the command surface.
name = "mrt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Native file picker. Drag-and-drop is the primary path, but it depends on a
# capability being granted correctly, and a silent failure there leaves no way to
# get files in at all. This is the door that always works.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `bundled` compiles SQLite from source and already defines SQLITE_ENABLE_FTS5.
# There is NO `fts5` feature in rusqlite 0.37 — requesting one fails the build.
# Verified against pragma_compile_options in spikes/sqlite-fts5.
rusqlite = { version = "0.37", features = ["bundled"] }

# Image decode/encode plus EXIF. Orientation is baked into pixels at ingest because
# no PDF library reads the tag — untreated, 20-40% of phone photos land sideways in
# every merged export, which is the most visible "this app is broken" failure.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
kamadak-exif = "0.6"
sha2 = "0.10"
ulid = "1"

# Argon2id for the app lock. Memory-hard, so a stolen database file cannot be
# brute-forced at GPU speed — which is the only thing a local password can
# meaningfully resist.
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["std"] }
base64 = "0.22"

# Filenames must be NFC-normalized (NTFS compares ordinally and does no
# normalization of its own) and truncated on grapheme boundaries, so a cut never
# severs a combining mark.
unicode-normalization = "0.1"
unicode-segmentation = "1"
# One window, one database. SQLite in WAL mode tolerates a second connection, but
# a second copy of the app means two review queues, two journal replays and two
# processes racing to move the same files. A second launch focuses the first.
tauri-plugin-single-instance = "2.4.3"

# Windows.Media.Ocr — the recognizer already built into Windows 10/11. Zero bundle
# cost and fully offline. Measured in the Phase 0 spike at ~350 ms per A4 page.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
